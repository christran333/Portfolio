<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christopher Tran — Product Designer</title>
    <meta name="description" content="Christopher Tran is a product designer who cares about storytelling, solving ambiguous problems, and visual polish. Open to Summer 2027 product design internships and full-time roles after graduating in December 2027." />
    <link rel="canonical" href="https://christophertran.xyz/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Christopher Tran" />
    <meta property="og:title" content="Christopher Tran — Product Designer" />
    <meta property="og:description" content="Christopher Tran is a product designer who cares about storytelling, solving ambiguous problems, and visual polish. Open to Summer 2027 product design internships and full-time roles after graduating in December 2027." />
    <meta property="og:url" content="https://christophertran.xyz/" />
    <meta name="twitter:card" content="summary" />
    <!-- The site is dark-only (no theme switch) -->
    <script>
      document.documentElement.dataset.theme = 'dark'
    </script>
    <!-- Dark from the very first frame, before the stylesheet arrives (same color as --bg), so loading never flashes white -->
    <meta name="theme-color" content="#171717" />
    <!-- Fonts linked here (not @imported from the stylesheet), so they start downloading with the page instead of
         after the script and the stylesheet, and are usually in before the hero animates -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Rock+Salt&display=swap" />
    <style>html { background: #171717; color-scheme: dark; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
